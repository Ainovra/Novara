<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novara — Login</title>
<link rel="stylesheet" href="/static/style.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
<div class="auth-card">
  <div class="brand-mark">Novara</div>
  <p class="auth-sub">Log in to your account</p>

  <div id="errorBox" class="auth-error" style="display:none;"></div>

  <!-- ===== Provider choice screen ===== -->
  <div id="providerScreen">
    {% if google_enabled %}
    <a href="/auth/google" class="provider-btn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.5-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3c-7.6 0-14.1 4.3-17.4 10.7z"/><path fill="#4CAF50" d="M24 45c5.4 0 10.3-2 14-5.3l-6.5-5.5c-2 1.5-4.6 2.4-7.5 2.4-5.3 0-9.7-3.4-11.3-8l-6.6 5.1C9.9 40.6 16.4 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.5 5.5C41.5 36 45 30.6 45 24c0-1.2-.1-2.5-.4-3.5z"/></svg>
      Continue with Google
    </a>
    {% endif %}

    <button class="provider-btn" id="showEmailBtn">
      <span class="provider-icon">✉️</span>
      Continue with email
    </button>

    <p class="auth-switch">Don't have an account? <a href="/signup">Sign up</a></p>
    <button id="guestBtn" class="skip-guest-btn">Skip — continue as guest</button>
  </div>

  <!-- ===== Email + password screen ===== -->
  <div id="emailScreen" style="display:none;">
    <button class="back-link" data-back>← Back</button>
    <input type="text" id="username" placeholder="Username" autocomplete="username">
    <input type="password" id="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn" class="auth-btn">Login</button>
  </div>

</div>

<script>
const errorBox = document.getElementById("errorBox");
const providerScreen = document.getElementById("providerScreen");
const emailScreen = document.getElementById("emailScreen");

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.style.display = "block";
}
function hideError() { errorBox.style.display = "none"; }

function showScreen(screen) {
  providerScreen.style.display = "none";
  emailScreen.style.display = "none";
  screen.style.display = "block";
  hideError();
}

document.getElementById("showEmailBtn").onclick = () => showScreen(emailScreen);
document.querySelectorAll("[data-back]").forEach(btn => {
  btn.onclick = () => showScreen(providerScreen);
});

document.getElementById("loginBtn").onclick = async () => {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  const res = await fetch("/api/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password })
  });
  const data = await res.json();

  if (data.error) showError(data.error);
  else window.location.href = data.redirect || "/app";
};
document.getElementById("password").addEventListener("keydown", (e) => {
  if (e.key === "Enter") document.getElementById("loginBtn").click();
});

document.getElementById("guestBtn").onclick = async () => {
  const res = await fetch("/api/guest", { method: "POST" });
  const data = await res.json();
  window.location.href = data.redirect || "/app";
};
</script>
</body>
</html>
