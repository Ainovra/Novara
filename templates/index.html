<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MyAI</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="brand-mark">MyAI<span class="cursor">▍</span></span>
      <button class="icon-btn" id="closeSidebar" aria-label="Close sidebar">✕</button>
    </div>

    <button class="new-chat-btn" id="newChatBtn">+ New chat</button>

    <div class="side-section">
      <div class="side-heading">Knowledge</div>
      <div class="file-list" id="fileList">
        <div class="empty-hint">No PDFs yet</div>
      </div>
      <label class="upload-btn">
        Upload PDF
        <input type="file" id="pdfInput" accept=".pdf" hidden>
      </label>
    </div>

    <div class="side-section">
      <div class="side-heading">Memory</div>
      <div class="memory-list" id="memoryList">
        <div class="empty-hint">Nothing remembered yet</div>
      </div>
      <div class="memory-actions">
        <input type="text" id="rememberInput" placeholder="Remember something…">
        <button id="rememberBtn" class="icon-btn">+</button>
      </div>
    </div>

    <div class="sidebar-footer">
      <span class="prompt-tag">~/MyAI $</span>
    </div>
  </aside>

  <!-- Main chat -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="openSidebar" aria-label="Open sidebar">☰</button>
      <span class="topbar-title">MyAI</span>
    </header>

    <div class="chat-area" id="chatArea">
      <div class="welcome" id="welcome">
        <div class="welcome-mark">MyAI<span class="cursor">▍</span></div>
        <p>Poocho kuch bhi — general baat, PDF notes se, ya web se latest info.</p>
      </div>
    </div>

    <div class="input-bar">
      <div class="input-wrap">
        <textarea id="messageInput" placeholder="Message MyAI…" rows="1"></textarea>
        <button id="sendBtn" class="send-btn" aria-label="Send">➤</button>
      </div>
    </div>
  </main>

</div>

<script src="/static/script.js"></script>
</body>
</html>
