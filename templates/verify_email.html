<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Novara — Verify Email</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0b0d12;
    color: #fff;
    font-family: Arial, sans-serif;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 430px;
    padding: 32px;
    border-radius: 20px;
    background: #151821;
    border: 1px solid #282d3a;
    text-align: center;
}

.logo {
    font-size: 30px;
    font-weight: 700;
    margin-bottom: 8px;
}

.subtitle {
    color: #9da4b5;
    margin-bottom: 28px;
}

.email {
    color: #b8becd;
    word-break: break-word;
    margin-bottom: 24px;
}

input {
    width: 100%;
    height: 56px;
    border-radius: 12px;
    border: 1px solid #343a49;
    background: #0e1118;
    color: white;
    outline: none;
    text-align: center;
    font-size: 25px;
    letter-spacing: 9px;
    padding-left: 9px;
}

button {
    width: 100%;
    height: 54px;
    margin-top: 16px;
    border: 0;
    border-radius: 12px;
    background: #fff;
    color: #111;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

button:disabled {
    opacity: .5;
}

.resend {
    background: transparent;
    color: #fff;
    border: 1px solid #343a49;
}

.error {
    display: none;
    color: #ff8e8e;
    margin: 15px 0;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">Novara</div>

    <div class="subtitle">
        Verify your email address
    </div>

    <div class="email">
        We sent a 6-digit verification code to
        <strong>{{ email }}</strong>
    </div>

    <div id="error" class="error"></div>

    <input
        id="code"
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        placeholder="000000"
    >

    <button id="verify">
        Verify email
    </button>

    <button id="resend" class="resend">
        Resend code
    </button>

</div>

<script>
const code = document.getElementById("code");
const verify = document.getElementById("verify");
const resend = document.getElementById("resend");
const error = document.getElementById("error");

function showError(message) {
    error.textContent = message;
    error.style.display = "block";
}

function clearError() {
    error.style.display = "none";
}

verify.onclick = async () => {

    clearError();

    if (!/^[0-9]{6}$/.test(code.value)) {
        showError("Enter the 6-digit verification code.");
        return;
    }

    verify.disabled = true;
    verify.textContent = "Verifying...";

    try {

        const response = await fetch("/api/verify-email", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                code: code.value
            })
        });

        const data = await response.json();

        if (!response.ok || data.error) {
            showError(data.error || "Verification failed.");
            verify.disabled = false;
            verify.textContent = "Verify email";
            return;
        }

        window.location.href =
            data.redirect || "/terms";

    } catch (e) {

        showError("Connection error. Please try again.");

        verify.disabled = false;
        verify.textContent = "Verify email";
    }
};

resend.onclick = async () => {

    clearError();

    resend.disabled = true;
    resend.textContent = "Sending...";

    try {

        const response = await fetch(
            "/api/resend-verification",
            {
                method: "POST"
            }
        );

        const data = await response.json();

        if (!response.ok || data.error) {
            showError(data.error || "Unable to send code.");
        } else {
            alert("A new verification code has been sent.");
        }

    } catch (e) {

        showError("Connection error.");

    }

    resend.disabled = false;
    resend.textContent = "Resend code";
};

code.addEventListener("input", () => {

    code.value =
        code.value.replace(/\D/g, "").slice(0, 6);

    if (code.value.length === 6) {
        verify.click();
    }
});
</script>

</body>
</html>
