<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Novara — Sign up</title>
<link rel="stylesheet" href="/static/style.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
<div class="auth-card">
  <img src="/static/icon-192.png" alt="Novara" class="brand-logo"><div class="brand-mark">Novara</div>
  <p class="auth-sub">Create a new account</p>

  <div id="errorBox" class="auth-error" style="display:none;"></div>

  <!-- ===== Provider choice screen ===== -->
  <div id="providerScreen">
    {% if google_enabled %}
    <a href="/auth/google" class="provider-btn">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.5-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 19 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.5 3 24 3c-7.6 0-14.1 4.3-17.4 10.7z"/><path fill="#4CAF50" d="M24 45c5.4 0 10.3-2 14-5.3l-6.5-5.5c-2 1.5-4.6 2.4-7.5 2.4-5.3 0-9.7-3.4-11.3-8l-6.6 5.1C9.9 40.6 16.4 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.5 5.5C41.5 36 45 30.6 45 24c0-1.2-.1-2.5-.4-3.5z"/></svg>
      Continue with Google
    </a>
    {% endif %}

    <button class="provider-btn" id="showEmailBtn">
      <span class="provider-icon">✉️</span>
      Continue with email
    </button>

    <p class="auth-switch">Already have an account? <a href="/login">Login</a></p>
    <button id="guestBtn" class="skip-guest-btn">Skip — continue as guest</button>
  </div>

  <!-- ===== Email + password screen ===== -->
  <div id="emailScreen" style="display:none;">

  <button class="back-link" data-back>
    ← Back
  </button>

  <input
    type="text"
    id="first_name"
    placeholder="First name"
    autocomplete="given-name"
    maxlength="50"
    required
  >

  <input
    type="text"
    id="last_name"
    placeholder="Last name"
    autocomplete="family-name"
    maxlength="50"
    required
  >

  <input
    type="text"
    id="username"
    placeholder="Username"
    autocomplete="username"
    minlength="3"
    maxlength="30"
    required
  >

  <input
    type="email"
    id="email"
    placeholder="Email address"
    autocomplete="email"
    required
  >

  <input
    type="tel"
    id="phone_number"
    placeholder="Phone number (optional)"
    autocomplete="tel"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="new-password"
    required
  >

  <div style="font-size:12px;line-height:1.6;opacity:.7;margin:8px 0 12px;">
    Password requirements:<br>
    • 8 or more characters<br>
    • Uppercase letter<br>
    • Lowercase letter<br>
    • Number<br>
    • Special character
  </div>

  <input
    type="password"
    id="confirm_password"
    placeholder="Confirm password"
    autocomplete="new-password"
    required
  >

  <button id="signupBtn" class="auth-btn">
    Create account
  </button>

</div>
</div>

<script>
const errorBox = document.getElementById("errorBox");
const providerScreen = document.getElementById("providerScreen");
const emailScreen = document.getElementById("emailScreen");

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.style.display = "block";
}
function hideError() { errorBox.style.display = "none"; }

function showScreen(screen) {
  providerScreen.style.display = "none";
  emailScreen.style.display = "none";
  screen.style.display = "block";
  hideError();
}

document.getElementById("showEmailBtn").onclick = () => showScreen(emailScreen);
document.querySelectorAll("[data-back]").forEach(btn => {
  btn.onclick = () => showScreen(providerScreen);
});

document.getElementById("signupBtn").onclick = async () => {

  hideError();

  const first_name =
    document.getElementById("first_name").value.trim();

  const last_name =
    document.getElementById("last_name").value.trim();

  const username =
    document.getElementById("username").value.trim();

  const email =
    document.getElementById("email").value.trim();

  const phone_number =
    document.getElementById("phone_number").value.trim();

  const password =
    document.getElementById("password").value;

  const confirm_password =
    document.getElementById("confirm_password").value;

  if (
    !first_name ||
    !last_name ||
    !username ||
    !email ||
    !password ||
    !confirm_password
  ) {
    showError("Please fill in all required fields.");
    return;
  }

  if (password !== confirm_password) {
    showError("Passwords do not match.");
    return;
  }

  const btn =
    document.getElementById("signupBtn");

  btn.disabled = true;
  btn.textContent = "Creating account...";

  try {

    const response = await fetch("/api/signup", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        first_name,
        last_name,
        username,
        email,
        phone_number,
        password,
        confirm_password
      })
    });

    const data = await response.json();

    if (!response.ok || data.error) {
      showError(
        data.error || "Unable to create account."
      );

      btn.disabled = false;
      btn.textContent = "Create account";
      return;
    }

    window.location.href =
      data.redirect || "/verify-email";

  } catch (error) {

    showError(
      "Unable to connect to Novara. Please try again."
    );

    btn.disabled = false;
    btn.textContent = "Create account";
  }
};
[
  "first_name",
  "last_name",
  "username",
  "email",
  "phone_number",
  "password",
  "confirm_password"
].forEach(id => {

  const field = document.getElementById(id);

  if (field) {
    field.addEventListener("keydown", e => {

      if (e.key === "Enter") {
        e.preventDefault();
        document.getElementById("signupBtn").click();
      }

    });
  }

});
});

document.getElementById("guestBtn").onclick = async () => {
  const res = await fetch("/api/guest", { method: "POST" });
  const data = await res.json();
  window.location.href = data.redirect || "/app";
};
</script>
</body>
</html>
