plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.novara.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.novara.app"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "WEB_BASE_URL", "\"https://novara-9s6c.onrender.com\""
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }

    signingConfigs {
        release {
            storeFile file("../novara-release.keystore")
            storePassword System.getenv("NOVARA_KEYSTORE_PASSWORD")
            keyAlias "novara"
            keyPassword System.getenv("NOVARA_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.1"

    implementation "androidx.activity:activity-ktx:1.9.3"
    implementation "androidx.activity:activity-compose:1.9.3"

    implementation "androidx.browser:browser:1.8.0"
    implementation "androidx.webkit:webkit:1.14.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"

    implementation "com.google.android.material:material:1.13.0"

    // Jetpack Compose
    implementation platform("androidx.compose:compose-bom:2024.09.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"

    // IMPORTANT: Required for Icons.Filled.Mic and other Material icons
    implementation "androidx.compose.material:material-icons-extended"

    debugImplementation "androidx.compose.ui:ui-tooling"

    // Networking
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
